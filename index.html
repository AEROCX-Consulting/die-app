:root{--ink:#04182A;--navy:#0D3B5C;--teal:#1FA0A3;--teal-d:#137F82;--teal-l:#5CC6C4;--mint:#E6F3F1;--volt:#F5D769;--paper:#F5F7F6;--line:#E2E8EB;--text:#0B2233;--muted:#55687A;--muted-d:#A7B8C6;--sub:#C7D4DE;--ok:#14804A;--ok-bg:#E5F4EB;--warn:#8A5A00;--warn-bg:#FFF4D6;--bad:#B23B30;--bad-bg:#FCE9E6;
--gold:radial-gradient(280px 200px at 88% 8%,rgba(245,197,66,.55),transparent 62%),linear-gradient(140deg,#2A1E04,#16120A 55%,#04182A);--plat:radial-gradient(280px 200px at 88% 8%,rgba(92,198,196,.55),transparent 62%),linear-gradient(140deg,#06302F,#08202A 55%,#04182A);--tita:radial-gradient(240px 180px at 88% 8%,rgba(245,215,105,.28),transparent 62%),radial-gradient(260px 200px at 0% 100%,rgba(31,160,163,.28),transparent 62%),linear-gradient(140deg,#2B3640,#0F1A23 55%,#04121C);
--st:env(safe-area-inset-top,0px);--sbm:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#02101C;font-family:Manrope,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--teal-l);outline-offset:2px;border-radius:8px}
/* shell */
#shell{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
#device{width:464px;height:980px;border-radius:70px;background:linear-gradient(145deg,#3A4148,#15191D 40%,#2A3036);padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 1.5px #59626B,inset 0 0 0 6px #0A0C0E;position:relative;flex:none;transform-origin:center center}
#device::before{content:"";position:absolute;left:-3px;top:210px;width:3px;height:64px;border-radius:2px 0 0 2px;background:#2A3036;box-shadow:0 88px 0 #2A3036,0 168px 0 #2A3036}
#device::after{content:"";position:absolute;right:-3px;top:300px;width:3px;height:104px;border-radius:0 2px 2px 0;background:#2A3036;box-shadow:0 190px 0 0 #2A3036}
#app{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;--st:62px;--sbm:34px}
#app{-webkit-mask-image:-webkit-radial-gradient(white,black);isolation:isolate}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:148px;height:5px;border-radius:3px;background:rgba(4,24,42,.85);z-index:99;pointer-events:none}
.island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:121}
.fakesb{position:absolute;top:12px;left:12px;right:12px;height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 46px 6px 58px;font-size:17px;font-weight:700;color:#fff;z-index:120;pointer-events:none;font-family:-apple-system,'SF Pro Text',Manrope,sans-serif}
.fakesb .ic{display:flex;gap:6px;align-items:center}
.fakesb svg{height:12px;width:auto}
@media (max-width:600px){
 #shell{padding:0;display:block}
 #device{width:100%;height:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
 #app{border-radius:0;--st:env(safe-area-inset-top,20px);--sbm:env(safe-area-inset-bottom,0px)}
 .island,.fakesb{display:none}
 .homebar{display:none}
 #device{transform:none!important;margin:0!important}
 #device::before,#device::after{display:none}
 #demo{position:fixed;inset:auto 0 0 0;max-height:82vh!important;max-height:80svh!important;max-height:var(--demo-h,80svh)!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s;z-index:200;width:auto!important;padding-bottom:calc(16px + var(--sbm))}
 #demo.open{transform:none}
 #demo .grab{display:block!important}
}
/* header */
.hd{background:var(--ink);padding:calc(var(--st) + 6px) 18px 14px;display:flex;align-items:center;justify-content:space-between;flex:none;position:relative;z-index:5}
.hd img{height:30px;display:block}
.hd .r{display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#fff;position:relative}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--volt);border:2px solid var(--ink);display:none}
.ib.has .dot{display:block}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink)}
/* views */
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px;display:none}
.view.on{display:block;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font-size:25px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.cap{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-size:24px;letter-spacing:-.03em;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.btn{display:block;width:100%;background:var(--volt);color:var(--ink);font-weight:800;border-radius:999px;padding:14px;text-align:center;font-size:15px}
.btn.dk{background:var(--ink);color:#fff}
.btn.gh{background:transparent;color:var(--muted);font-weight:700;padding:10px}
.btn.ln{background:#fff;border:1px solid var(--line);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--mint);color:var(--teal-d)}
.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.b{background:var(--bad-bg);color:var(--bad)}.chip.g{background:var(--ok-bg);color:var(--ok)}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;flex:none;font-size:18px}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-size:14.5px;color:var(--ink)}
.li small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.chev{color:var(--muted);font-weight:800}
/* map */
.map{height:210px;border-radius:20px;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:12px;background:
 linear-gradient(90deg,rgba(13,59,92,.05) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(rgba(13,59,92,.05) 1px,transparent 1px) 0 0/30px 30px,#E7EFEC}
.map .rd{position:absolute;height:9px;background:#fff;border-radius:5px;transform-origin:left;box-shadow:0 0 0 1px #DCE5E2}
.pin{position:absolute;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--teal);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2);display:grid;place-items:center}
.pin i{transform:rotate(45deg);font-style:normal;font-size:12px;color:#fff;font-weight:800}
.pin.fast{background:var(--ink)}.pin.fast i{color:var(--volt)}
.me{position:absolute;width:18px;height:18px;border-radius:50%;background:#2F7BF6;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,123,246,.18)}
.mapsearch{position:absolute;top:10px;left:10px;right:10px;background:#fff;border-radius:14px;padding:10px 12px;font-size:13.5px;color:var(--muted);font-weight:600;box-shadow:0 4px 14px rgba(4,24,42,.1)}
/* banner (always-on) */
.adb{margin-top:12px;border-radius:20px;overflow:hidden;background:var(--ink);color:#fff;position:relative;display:grid;grid-template-columns:1fr 112px;min-height:110px}
.adb .t{padding:14px 0 14px 16px}
.adb .sp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--volt)}
.adb b{display:block;font-size:16px;line-height:1.2;margin-top:6px;letter-spacing:-.01em}
.adb p{font-size:12px;color:var(--sub);margin-top:4px}
.adb .go{display:inline-block;margin-top:10px;background:var(--volt);color:var(--ink);font-size:12px;font-weight:800;border-radius:999px;padding:6px 12px}
.adb .vis{display:grid;place-items:center;background:radial-gradient(120px 90px at 70% 30%,rgba(31,160,163,.5),transparent 70%)}
.adb .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center}
/* tabbar */
.tb{background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--sbm));flex:none;position:relative;z-index:5}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);min-width:58px;padding:2px 0}
.tb button.on{color:var(--teal-d)}
.tb svg{width:23px;height:23px}
/* charge */
.chg{border-radius:24px;background:var(--ink);color:#fff;padding:20px;margin-top:12px;position:relative;overflow:hidden}
.chg::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(31,160,163,.35),transparent 65%)}
.ring{width:170px;height:170px;margin:8px auto 4px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:34px;letter-spacing:-.04em;display:block;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--sub);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;position:relative;z-index:1}
.kv div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;text-align:center}
.kv b{display:block;font-size:17px;color:var(--volt);font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);font-weight:700}
/* rewards */
.mcard{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:196px;margin-top:12px;box-shadow:0 14px 34px rgba(4,24,42,.25)}
.mcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 0) 0 0/14px 14px;-webkit-mask:linear-gradient(120deg,transparent 30%,#000);mask:linear-gradient(120deg,transparent 30%,#000)}
.mcard .bd{position:absolute;top:12px;right:12px}
.mcard .lane{position:absolute;left:18px;right:110px;top:92px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.mcard .lane i{display:block;height:100%;border-radius:3px}
.mcard>*{position:relative}
.mcard .lvl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.mcard .nm{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.mcard img{display:none}
.mcard .mb{position:absolute;left:18px;bottom:16px;font-size:12px;font-weight:700;opacity:.9}
.mcard .pts{position:absolute;right:18px;bottom:14px;text-align:right}
.mcard .pts b{font-size:24px;display:block;letter-spacing:-.03em}
.mcard .pts span{font-size:11px;font-weight:700;opacity:.85}
.mcard.gold{background:var(--gold)}.mcard.plat{background:var(--plat)}.mcard.tita{background:var(--tita)}
.mcard.gold .nm{color:#F5C542}.mcard.plat .nm{color:#8EE0DC}.mcard.tita .nm{color:#E6ECF0}
.mcard .lvl{color:rgba(255,255,255,.75)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:5px;transition:width .6s}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tiers button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 8px;font-weight:800;font-size:13px;color:var(--ink);position:relative}
.tiers button .sw{display:block;margin:0 auto 4px;width:40px;height:40px}
.tiers button.sel{border-color:var(--ink)}
.tiers button .you{position:absolute;top:-8px;right:6px;background:var(--ink);color:var(--volt);font-size:9.5px;padding:2px 6px;border-radius:999px}
.ben{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.ben:last-child{border-bottom:0}
.ben .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;background:var(--ok-bg);color:var(--ok)}
.ben .ck.lk{background:var(--paper);color:var(--muted)}
.ben b{font-size:14px;color:var(--ink);display:block}
.ben small{font-size:12px;color:var(--muted)}
.earn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.earn div{border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.earn div span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.earn div.y{background:var(--ok-bg);border-color:#CBE7D6}
/* car */
.carhero{border-radius:22px;background:var(--ink);color:#fff;padding:16px;margin-top:12px;position:relative;overflow:hidden}
.carhero .vis{height:110px;display:grid;place-items:center}
.carhero b{font-size:21px;letter-spacing:-.02em;display:block}
.carhero small{color:var(--sub);font-size:12.5px;font-weight:600}
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.health div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.health .s{font-size:20px}
.health b{display:block;font-size:12.5px;color:var(--ink);margin-top:2px}
.health span{font-size:11px;font-weight:700}
/* overlays */
.ov{position:absolute;inset:0;z-index:60;display:none}
.ov.on{display:block}
#push{inset:0 0 auto 0;padding:calc(var(--st) + 6px) 10px 0;pointer-events:none;z-index:80}
#push.on{display:block}
.pn{pointer-events:auto;background:rgba(246,248,248,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr;gap:11px;box-shadow:0 14px 40px rgba(0,0,0,.28);animation:drop .45s cubic-bezier(.2,.9,.3,1.2);text-align:left;width:100%}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.pn .ai{width:40px;height:40px;border-radius:10px;overflow:hidden}
.pn .ai img{width:100%;height:100%}
.pn .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.pn b{display:block;font-size:14.5px;color:var(--ink);margin-top:1px;line-height:1.25}
.pn p{font-size:13.5px;color:var(--text);line-height:1.35;margin-top:1px}
#sheet{background:rgba(4,24,42,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + var(--sbm));animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:40px;height:5px;border-radius:3px;background:#D5DDE1;margin:0 auto 12px}
#page{background:var(--paper);display:none;flex-direction:column;z-index:70}
#page.on{display:flex;animation:slin .3s ease}
@keyframes slin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.ph{background:var(--ink);color:#fff;padding:calc(var(--st) + 6px) 14px 14px;display:flex;align-items:center;gap:10px;flex:none}
.ph .bk{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px;font-weight:800}
.ph b{font-size:16px}
.pb{flex:1;overflow-y:auto;padding:16px 16px calc(24px + var(--sbm))}
#take{background:#000;z-index:75}
.tk{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(500px 360px at 80% 10%,rgba(31,160,163,.45),transparent 60%),radial-gradient(400px 300px at 0% 100%,rgba(245,215,105,.14),transparent 60%),var(--ink);color:#fff;padding:calc(var(--st) + 8px) 22px calc(22px + var(--sbm));animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.tk .top{display:flex;justify-content:space-between;align-items:center}
.tk .sp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--volt)}
.tk .x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px;font-weight:800}
.tk .vis{flex:1;display:grid;place-items:center;min-height:180px}
.tk h2{font-size:32px;line-height:1.05;letter-spacing:-.035em;font-weight:800}
.tk p{color:var(--sub);font-size:15px;margin-top:10px;line-height:1.45}
.tk .vs{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;font-weight:800}
.tk .vs span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}
.tk .vs i{font-style:normal;color:var(--volt)}
#toast{position:absolute;left:16px;right:16px;top:calc(var(--st) + 64px);z-index:95;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{display:block;animation:up .3s ease}
/* toggles */
.tg{width:50px;height:30px;border-radius:999px;background:#C9D3D9;position:relative;flex:none;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.on{background:var(--teal)}.tg.on i{left:23px}
.cons{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:18px;margin-top:10px;background:#fff}
.cons .tx{flex:1}.cons b{font-size:14.5px;color:var(--ink);display:block}.cons small{font-size:12.5px;color:var(--muted)}
/* survey */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.scale button{height:56px;border-radius:16px;border:1.5px solid var(--line);font-size:22px;background:#fff}
.scale button.on{border-color:var(--ink);background:var(--mint)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.reasons button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff}
.reasons button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* onboarding */
#onb{z-index:85;background:var(--ink);color:#fff}
.ob{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--st) + 24px) 22px calc(22px + var(--sbm));background:radial-gradient(500px 360px at 90% 0%,rgba(31,160,163,.35),transparent 60%),radial-gradient(400px 300px at 0% 100%,rgba(245,215,105,.12),transparent 60%),var(--ink)}
.ob img{height:44px;align-self:flex-start}
.ob h2{font-size:34px;line-height:1.05;letter-spacing:-.035em;margin-top:auto}
.ob p{color:var(--sub);margin-top:12px;font-size:15px;line-height:1.5}
.ob .cons{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.ob .cons b{color:#fff}.ob .cons small{color:var(--sub)}
.dots{display:flex;gap:6px;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}.dots i.on{width:22px;background:var(--volt)}

/* photo variants (ID. Tiguan, ID. Polo) */
.adb.photo{display:block;min-height:168px;background:var(--ink) center/cover no-repeat}
.adb.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,24,42,.92) 0%,rgba(4,24,42,.7) 42%,rgba(4,24,42,0) 75%)}
.adb.photo .t{position:relative;padding:16px 0 16px 16px;max-width:62%}
.tk.photo{padding:0;background:var(--ink)}
.tk.photo .img{height:52%;background:center 60%/cover no-repeat;position:relative}
.tk.photo .img::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,rgba(4,24,42,0),var(--ink))}
.tk.photo .top{position:absolute;top:calc(var(--st) + 8px);left:22px;right:22px;z-index:2}
.tk.photo .top .sp{background:rgba(4,24,42,.7);padding:6px 10px;border-radius:999px}
.tk.photo .body{flex:1;display:flex;flex-direction:column;padding:0 22px calc(22px + var(--sbm));margin-top:-30px;position:relative}
.tk.photo .body .cta{margin-top:auto}
.phimg{height:190px;border-radius:20px;background:center 60%/cover no-repeat;margin-top:12px}
/* next-car options */
.opts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:0 0 78%;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left}
.opt .im{height:150px;background:center/cover no-repeat}
.opt .tx{padding:12px 14px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt b{display:block;font-size:15.5px;color:var(--ink);letter-spacing:-.01em}
.opt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.opt .go{width:32px;height:32px;border-radius:50%;background:var(--volt);display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none}
/* in-app browser */
#web{z-index:78;background:#fff;display:none;flex-direction:column}
#web.on{display:flex;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.wb{padding:calc(var(--st) + 4px) 12px 10px;background:var(--ink);display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center;flex:none}
.wb button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:17px;font-weight:800;color:#fff}
.wb a{text-decoration:none}
.wb .u{text-align:center;min-width:0}
.wb .u b{display:block;font-size:13.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb .u small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;position:relative;background:#fff}
.wbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wfb{flex:none;padding:8px 14px calc(8px + var(--sbm));border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F7F8F9}
.wfb a{color:var(--teal-d);font-weight:800;text-decoration:none;white-space:nowrap}
/* year wrapped */
#wrap{z-index:82;background:#000}
.wr{position:absolute;inset:0;overflow:hidden;color:#fff}
.wr .orb{width:210px;height:210px;border-radius:50%;margin:30px auto 0;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.06) 60%);border:1px solid rgba(255,255,255,.25);box-shadow:0 0 60px rgba(245,215,105,.25);font-size:92px;animation:pop .6s backwards}
.wr .orb b{font-size:64px;letter-spacing:-.04em;display:block;line-height:1}.wr .orb span{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.wr .bars{position:absolute;top:calc(var(--st) + 4px);left:14px;right:14px;display:flex;gap:4px;z-index:5}
.wr .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;position:relative}
.wr .bars i b{position:absolute;inset:0;width:0;background:#fff}
.wr .bars i.done b{width:100%}
.wr .bars i.cur b{animation:fillbar 6s linear forwards}
@keyframes fillbar{to{width:100%}}
.wr .wtop{position:absolute;top:calc(var(--st) + 16px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.wr .wtop img{height:24px}
.wr .wtop button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);font-size:17px;font-weight:800;color:#fff}
.wr .tap{position:absolute;top:0;bottom:0;width:35%;z-index:3}.wr .tap.l{left:0}.wr .tap.r{right:0;width:65%}
.wr .sl{position:absolute;inset:0;padding:calc(var(--st) + 80px) 26px calc(36px + var(--sbm));display:flex;flex-direction:column;animation:wsl .55s cubic-bezier(.2,.9,.3,1)}
@keyframes wsl{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.wr .k{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.wr .big{font-size:76px;font-weight:800;letter-spacing:-.05em;line-height:.95;margin-top:10px;font-variant-numeric:tabular-nums}
.wr .h{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:10px}
.wr p.c{font-size:17px;line-height:1.45;margin-top:14px;opacity:.9;max-width:330px}
.wr .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.9;animation:float 7s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(18px,-22px) scale(1.06)}}
.wr .stack{margin-top:auto;display:grid;gap:10px;position:relative;z-index:2}
.wr .row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 14px;font-weight:800;font-size:15px;backdrop-filter:blur(4px)}
.wr .row span{font-weight:600;opacity:.8;font-size:13px}
.wr .rank{display:flex;gap:12px;align-items:center}
.wr .rank em{font-style:normal;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px}
.wr .wmap{position:relative;height:250px;margin-top:18px;border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.wr .wmap svg{position:absolute;inset:0;width:100%;height:100%}
.wr .pinw{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;font-weight:800;white-space:nowrap;text-align:center;animation:pop .5s backwards}
.wr .pinw i{display:block;width:12px;height:12px;border-radius:50%;background:#F5D769;margin:4px auto 0;box-shadow:0 0 0 6px rgba(245,215,105,.25)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-80%) scale(.6)}}
.wr .share{display:flex;gap:10px;margin-top:16px}
.wr .share button{flex:1;border-radius:999px;padding:13px;font-weight:800;font-size:14.5px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1100px) rotate(540deg)}}
.wrapcard{margin-top:12px;border-radius:20px;padding:16px;color:#fff;background:radial-gradient(220px 160px at 90% 0%,rgba(245,215,105,.5),transparent 60%),radial-gradient(240px 180px at 0% 100%,rgba(31,160,163,.55),transparent 60%),linear-gradient(135deg,#0D3B5C,#04182A);display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left}
.wrapcard b{display:block;font-size:17px;letter-spacing:-.02em}
.wrapcard small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.wrapcard .go{width:40px;height:40px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
/* rewards in wrapped style */
#app.dk .tb{background:#04182A;border-top-color:rgba(255,255,255,.08)}#app.dk .tb button{color:#A7B8C6}#app.dk .tb button.on{color:#F5D769}#app.dk .homebar{background:rgba(255,255,255,.85)}
#v-rewards.rwv{color:#fff;padding:0 0 28px}
.rwbg{position:absolute;inset:0;pointer-events:none;z-index:0}
.rwin{position:relative;z-index:1;padding:18px 16px 0}
.rw-k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.rw-h{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:6px}
.rw-hero{text-align:center;padding:16px 0 6px;position:relative}
.rw-hero .glow{position:absolute;left:50%;top:6px;width:240px;height:240px;transform:translateX(-50%);border-radius:50%;filter:blur(8px);opacity:.75;animation:float 7s ease-in-out infinite alternate}
.rw-hero .bd{position:relative;display:inline-block;animation:pop .6s backwards}
.rw-hero .nm{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:6px;position:relative}
.rw-hero .pts{font-size:15px;font-weight:700;opacity:.85;margin-top:8px;position:relative}
.rw-hero .pts b{font-size:22px;letter-spacing:-.02em;opacity:1;font-variant-numeric:tabular-nums}
.rw-bar{margin:18px 0 0;position:relative}
.rw-bar .tr{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.rw-bar .tr i{display:block;height:100%;border-radius:6px;width:0;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.rw-bar .lb{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:8px;opacity:.85}
.rw-glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px 16px;margin-top:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rw-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.rw-tiers button{border-radius:16px;padding:10px 3px 10px;font-size:12px!important;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:13px;position:relative}
.rw-tiers button.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
.rw-tiers button .you{position:absolute;top:-8px;right:8px;background:#F5D769;color:#04182A;font-size:9.5px;padding:2px 7px;border-radius:999px}
.rw-ben{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.rw-ben:last-child{border-bottom:0}
.rw-ben .ck{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;background:rgba(245,215,105,.18);color:#F5D769}
.rw-ben .ck.lk{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55)}
.rw-ben b{font-size:14.5px;display:block}
.rw-ben small{font-size:12px;opacity:.75}
.rw-earn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rw-earn div{border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.rw-earn div.y{background:rgba(92,198,196,.16);border-color:rgba(92,198,196,.35)}
.rw-earn div span{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.rw-cta{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:16px;margin-top:14px;color:#fff}
.rw-cta b{display:block;font-size:16.5px;letter-spacing:-.02em}
.rw-cta small{display:block;font-size:12.5px;opacity:.8;margin-top:2px}
.rw-cta .go{width:40px;height:40px;border-radius:50%;background:#F5D769;color:#04182A;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
/* demo panel */
#demo{width:340px;max-height:980px;overflow-y:auto;background:#fff;border-radius:28px;padding:20px;flex:none;box-shadow:0 30px 70px rgba(0,0,0,.35)}
#demo .grab{display:none;width:40px;height:5px;border-radius:3px;background:#D5DDE1;margin:0 auto 12px}
#demo h3{font-size:19px;letter-spacing:-.02em;color:var(--ink)}
#demo .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
#demo .grp{margin-top:16px}
#demo .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.segs{display:grid;gap:6px;margin-top:8px}
.segs button{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.segs button b{display:block;font-size:13.5px;color:var(--ink)}
.segs button small{font-size:11.5px;color:var(--muted)}
.segs button.on{border-color:var(--ink);background:var(--mint)}
.evs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.evs button{border-radius:12px;padding:10px;font-size:12.5px;font-weight:800;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);line-height:1.25}
.evs button small{display:block;font-weight:600;color:var(--muted);font-size:10.5px;margin-top:2px}
.evs button.na{opacity:.4}
.note{margin-top:14px;background:var(--warn-bg);color:#5A3D00;border-radius:14px;padding:10px 12px;font-size:11.5px;line-height:1.45}
#pm{position:absolute;left:3px;top:max(4px,calc(var(--st) - 4px));width:26px;height:26px;z-index:130;display:grid;place-items:center;background:none;border:0;padding:0}
#pm i{display:block;width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.38)}
#demo .dhd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:-20px;z-index:3;background:#fff;margin:-12px -20px 0;padding:12px 20px 8px}
#demo .dx{width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--ink);display:grid;place-items:center;flex:none}
#demo.hide{display:none}
</style>
</head>

$$('#wrap [data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(n*e));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
if(WI<L.length-1)WT=setTimeout(()=>{WI++;rWrap()},6000);if(WI===L.length-1)$$('#wrap .bars i.cur b').forEach(b=>b.style.animation='none')}
/* ---------- vehicle age ---------- */
function openAge(){const s=seg(),y=Math.ceil(s.age),d=wrapData(s);page('Happy birthday',`<div class="wrapcard" style="display:block;position:relative;overflow:hidden;min-height:220px"><div class="confetti">${Array.from({length:22},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#F5D769','#5CC6C4','#fff'][i%3]};animation-duration:${2.4+(i%4)*.5}s;animation-delay:${(i%6)*.12}s"></i>`).join('')}</div><div style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--volt)">🎂 ${y} years together</div><b style="font-size:26px;margin-top:8px;line-height:1.1">Happy birthday, ${s.car}!</b><div style="display:flex;justify-content:center;margin-top:8px">${s.car==='Audi Q4 e-tron'?`<img src="${Q4}" alt="" style="width:100%;max-width:330px;display:block;position:relative;-webkit-mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 62%,transparent 100%)">`:CAR('#F5D769',220)}</div></div>
<div class="row2"><div class="stat"><span>Since day one</span><b>${fmt(s.km)} km</b><span>all electric</span></div><div class="stat"><span>Charged with us</span><b>${fmt(Math.round(d.ses*s.age))}</b><span>sessions</span></div></div>
<div class="card"><div class="cap">${y} years is a good moment to</div>
<button class="li" style="width:100%;text-align:left" onclick="openNew(seg())"><div class="ic">✨</div><div class="tx"><b>See what a new model would change</b><small>Range, charging speed and comfort compared with your car</small></div><span class="chev">›</span></button>
<button class="li" style="width:100%;text-align:left" onclick="toast('Service appointment requested (prototype)')"><div class="ic">🔧</div><div class="tx"><b>Book the ${y}-year check-up</b><small>Battery health and tyres included</small></div><span class="chev">›</span></button>
<button class="li" style="width:100%;text-align:left" onclick="openWrap()"><div class="ic">🎉</div><div class="tx"><b>Relive your year on the road</b><small>Your 2026 wrapped</small></div><span class="chev">›</span></button></div>`)}

/* ---------- onboarding ---------- */
let ob=0;
function startOnb(){ob=0;$('#onb').classList.add('on');rOnb()}
function rOnb(){const d=`<div class="dots">${[0,1,2].map(i=>`<i class="${i===ob?'on':''}"></i>`).join('')}</div>`;let h='';
if(ob===0)h=`<img src="${LOGO}" alt=""><h2>Charge anywhere. Get rewarded for every kilometre.</h2><p>Your card, your home charger and your car in one app.</p>${d}<button class="btn" id="obn">Get started</button>`;
if(ob===1)h=`<img src="${LOGO}" alt=""><h2 style="margin-top:28px">What would you like to hear from us?</h2><p>Charging works the same whatever you choose. Change it any time in your account.</p><div style="margin-top:8px">${consentRows()}</div>${d}<button class="btn" id="obn">Save my choices</button>`;
if(ob===2)h=`<img src="${LOGO}" alt=""><h2>You're in. Welcome to Bronze.</h2><p>Every kWh you charge adds status points. Double at D'Ieteren Energy stations. Move up to Silver and Gold for more benefits.</p><div class="mcard gold" style="margin-top:18px;min-height:150px"><span class="bd">${badge(0,76)}</span><div class="lvl">D'Ieteren Energy Rewards</div><div class="nm" style="color:#E6A46A">Bronze</div><div class="mb">Member since today</div></div>${d}<button class="btn" id="obn">Start charging</button>`;
$('#onb').innerHTML=`<div class="ob">${h}</div>`;if(ob===1)bindCons('#onb');$('#obn').onclick=()=>{if(ob<2){ob++;rOnb()}else{$('#onb').classList.remove('on');show('home')}}}
/* ---------- demo panel ---------- */
function evBtns(s,f){return Object.entries(EV).filter(([k,e])=>f(e)).map(([k,e])=>`<button data-e="${k}" class="${e.ok(s)?'':'na'}">${e.n}<small>${e.d}</small></button>`).join('')}
function rDemo(){const s=seg();$('#demo').innerHTML=`<div class="grab"></div><div class="dhd"><h3>Presenter controls</h3><button class="dx" id="dx" aria-label="Close presenter mode">×</button></div><p class="sub">Choose a driver segment, then trigger a moment. Pushes respect the driver's consent choices.</p>
<div class="grp"><div class="cap">Driver segment</div><div class="segs">${SEG.map(x=>`<button class="${x.id===S.seg?'on':''}" data-s="${x.id}"><b>${x.key}</b><small>${x.desc} · ${x.car}</small></button>`).join('')}</div></div>
<div class="grp"><div class="cap">Customer experience and retention</div><div class="evs">${evBtns(s,e=>!e.g)}</div></div>
<div class="grp"><div class="cap">Partner campaigns · data monetization</div><p class="hint">Pushes sold to partners such as VDF Finance, the VW brands, Engie, Luminus. At launch targeted by brand share; car-level targeting follows once car data is connected.</p><div class="evs">${evBtns(s,e=>e.g==='p')}</div></div>
<div class="grp"><div class="cap">In-app ad space</div><div class="evs"><button data-x="banner">Always-on banner<small>${S.banner?'Showing · closeable':'Closed · tap to restore'}</small></button><button data-x="onb">Sign-up and consent<small>Replay onboarding</small></button></div></div>
<div class="grp"><div class="cap">Loyalty programme · separate track</div><div class="evs"><button data-x="rewards">Rewards<small>Bronze · Silver · Gold · Platinum</small></button><button data-x="charge">Charging session<small>Points, 2× at D'Ieteren Energy</small></button><button data-x="wrap">Year wrapped<small>Story, like a year review</small></button></div></div>
<div class="note"><b>Prototype.</b> All names, figures, prices, models and locations are illustrative. Loyalty and partner campaigns are two separate initiatives. Tiers, point rules, thresholds and benefits are placeholders for the loyalty workshop. Partner names and tariffs in the campaigns are examples. Car data comes via Smartcar or OEM connectors; the data points per brand are still to be confirmed. The always-on banner needs custom development.</div>`;
$$('#demo .segs button').forEach(b=>b.onclick=()=>{S.seg=+b.dataset.s;S.tyre=S.warn=S.dmg=S.electra=false;S.selTier=null;S.lastScore=null;S.banner=true;$('#avatar').textContent=seg().ini;$('#avatar').style.background=TIERS[tierOf(seg())].col;rDemo();const v=$$('.view').find(x=>x.classList.contains('on')).id.slice(2);render(v);toast('Now showing: '+seg().key)});
$$('#demo [data-e]').forEach(b=>b.onclick=()=>{const e=EV[b.dataset.e];if(!e.ok(seg())){toast(e.why?`${e.n}: ${e.why}`:`"${e.n}" doesn't apply to this segment`);return}closeDemoMobile();setTimeout(()=>e.run(),250)});
$$('#demo [data-x]').forEach(b=>b.onclick=()=>{const x=b.dataset.x;closeDemoMobile();if(x==='banner'){S.banner=!S.banner;show('home');rDemo()}if(x==='onb')startOnb();if(x==='charge'){show('charge')}if(x==='rewards')show('rewards');if(x==='wrap')openWrap()})}
const isMob=()=>innerWidth<=600;
function sizeDemo(){if(!isMob())return;const d=$('#demo'),h=(window.visualViewport?visualViewport.height:innerHeight);d.style.maxHeight='';d.style.setProperty('--demo-h',Math.round(h*0.85)+'px')}
if(window.visualViewport)visualViewport.addEventListener('resize',sizeDemo);addEventListener('orientationchange',()=>setTimeout(sizeDemo,300));
function openDemo(){const d=$('#demo');sizeDemo();d.scrollTop=0;d.classList.remove('hide');d.classList.add('open')}
function closeDemo(){const d=$('#demo');d.classList.remove('open');if(!isMob())d.classList.add('hide')}
function closeDemoMobile(){$('#demo').classList.remove('open')}
$('#pm').onclick=e=>{e.stopPropagation();const d=$('#demo');(d.classList.contains('open')||(!isMob()&&!d.classList.contains('hide')))?closeDemo():openDemo()};
document.addEventListener('click',e=>{if(e.target.closest('#dx'))closeDemo()});
let lt=0;$('#logo').onclick=()=>{const n=Date.now();if(n-lt<400)openDemo();lt=n};
document.addEventListener('click',e=>{const d=$('#demo');if(d.classList.contains('open')&&!d.contains(e.target)&&e.target.closest('#pm')===null&&!e.target.closest('[onclick*="openDemo"]')&&e.target.id!=='logo')d.classList.remove('open')},true);
/* ---------- fit device on desktop ---------- */
function fitDevice(){const d=$('#device');if(innerWidth<=600){d.style.transform='';d.style.margin='';$('#demo').style.maxHeight='';sizeDemo();return}const sc=Math.min(1,(innerHeight-40)/980);d.style.transform=`scale(${sc})`;d.style.margin=`${-980*(1-sc)/2}px ${-464*(1-sc)/2}px`;$('#demo').style.maxHeight=(980*sc)+'px'}
addEventListener('resize',fitDevice);fitDevice();
/* ---------- offline app (when hosted) ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ---------- start ---------- */
$('#avatar').style.background=TIERS[tierOf(seg())].col;$('#avatar').textContent=seg().ini;
rDemo();show('home');startOnb();
</script>
</body>
</html>
